name: Build Release

# Controls when the action will run.
on:
  # Triggers the workflow on tag push
  push:
    tags: "*"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: macos-26
    strategy:
      matrix:
        node: [22]
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - run: npm install
      - name: Build MacOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ vars.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
            npm run electron:mac
      - name: Build Win & Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            npm run electron:linux
            npm run electron:windows
            mv release/Altitude-Metrix-Wallet-win32.exe release/Altitude-Metrix-Wallet-win32-x64.exe
            npm run electron:windows32
            mv release/Altitude-Metrix-Wallet-win32.exe release/Altitude-Metrix-Wallet-win32-x86.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-primary
          path: |
            release/Altitude-Metrix-Wallet-mac-arm64.dmg
            release/Altitude-Metrix-Wallet-linux-x64.AppImage
            release/Altitude-Metrix-Wallet-win32-x86.exe
            release/Altitude-Metrix-Wallet-win32-x64.exe
          retention-days: 1

  # Some users still need an Intel mac-x64 build. macos-15-intel is GitHub's
  # last x64 macOS runner image and is scheduled to retire in Fall 2027 - once
  # that happens (or a replacement x64 image ships) this job, its artifact,
  # and the mac-x64 asset below need to be revisited.
  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - run: npm install
      - name: Build MacOS (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ vars.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
            npm run electron:mac-x64
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-mac-x64
          path: release/Altitude-Metrix-Wallet-mac-x64.dmg
          retention-days: 1

  release:
    needs: [build, build-mac-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run : |
          set -x
          ls -l ./release/
          assets=()
          assets+=("./release/Altitude-Metrix-Wallet-mac-arm64.dmg")
          assets+=("./release/Altitude-Metrix-Wallet-mac-x64.dmg")
          assets+=("./release/Altitude-Metrix-Wallet-linux-x64.AppImage")
          assets+=("./release/Altitude-Metrix-Wallet-win32-x86.exe")
          assets+=("./release/Altitude-Metrix-Wallet-win32-x64.exe")
          tag_name="${GITHUB_REF#refs/*/}"
          gh release create "$tag_name"   --draft=true --title "v$tag_name" "${assets[@]}"
