<div class="browser-page">
    <div class="browser-toolbar">
        <button class="btn btn-default btn-icon btn-sm" (click)="goBack()" [disabled]="!canGoBack">
            <fa-icon icon="arrow-left"></fa-icon>
        </button>
        <button class="btn btn-default btn-icon btn-sm" (click)="goForward()" [disabled]="!canGoForward">
            <fa-icon icon="arrow-right"></fa-icon>
        </button>
        <button class="btn btn-default btn-icon btn-sm" (click)="reload()" [disabled]="showHome">
            <fa-icon icon="sync-alt"></fa-icon>
        </button>
        <button class="btn btn-default btn-icon btn-sm" (click)="goHome()">
            <fa-icon icon="home"></fa-icon>
        </button>
        <input
            type="text"
            [(ngModel)]="addressInput"
            (keyup.enter)="navigate(addressInput)"
            placeholder="{{ 'COMPONENTS.BROWSER.ADDRESSPLACEHOLDER' | translate }}"
        />
        <button class="btn btn-default btn-sm" (click)="navigate(addressInput)">
            {{ 'COMPONENTS.BROWSER.GOBUTTON' | translate }}
        </button>
        <button class="btn btn-default btn-icon btn-sm" (click)="openDevTools()" [disabled]="showHome" title="{{ 'COMPONENTS.BROWSER.DEVTOOLS' | translate }}">
            <fa-icon icon="code"></fa-icon>
        </button>
    </div>

    @if (showHome) {
        <div class="browser-home">
            <h2>{{ 'COMPONENTS.BROWSER.QUICKLAUNCH' | translate }}</h2>
            <div class="browser-tiles">
                @for (link of quickLinks; track link.url) {
                    <button class="browser-tile" [class.has-image]="link.ogImage" (click)="navigate(link.url)">
                        @if (link.ogImage) {
                            <div class="browser-tile-image" [style.background-image]="'url(' + link.ogImage + ')'"></div>
                            <span class="browser-tile-label">{{ link.ogTitle || link.name }}</span>
                        } @else {
                            <fa-icon icon="globe"></fa-icon>
                            <span>{{ link.name }}</span>
                        }
                    </button>
                }
            </div>
        </div>
    }

    <div #webviewContainer class="browser-webview" [style.display]="showHome ? 'none' : 'flex'"></div>
</div>
