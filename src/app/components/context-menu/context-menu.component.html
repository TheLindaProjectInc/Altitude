<div #contextMenu class="context-menu titlebar-menu" [ngClass]="{'visible':menuActive}" [ngStyle]="position">
  <div class="dropdown">
    <div class="dropdown-content">
      @for (item of contextMenuService.menuItems; track item) {
        <button (click)="item.func()">{{ item.name | translate }}</button>
      }
    </div>
  </div>
</div>
