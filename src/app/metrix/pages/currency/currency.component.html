<div class="content">

  <h1>{{ 'PAGES.CURRENCY.TITLE' | translate }}</h1>

  <div class="form-inline">
    <span>{{ 'MISC.SEARCH' | translate }}</span>
    <text-input [(inputModel)]="search"></text-input>
  </div>

  @for (currency of currenciesToShow(); track currency) {
    <button class="btn btn-default" (click)="setCurrency(currency)"
      [ngClass]="{'btn-success':currency===currencyService.currency}"
      title="{{ currencyService.currencyName(currency) }}">
      {{currency}}
    </button>
  }

</div>
